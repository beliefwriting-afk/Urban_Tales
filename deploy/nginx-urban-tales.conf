# nginx 反向代理 —— 城市物語 Urban Tales
# 安裝位置：/etc/nginx/sites-available/urban-tales.conf
#（bootstrap.sh 代入 __DOMAIN__ 後複製並建立 sites-enabled 連結）
#
# ★ HTTPS 對這個專案是硬需求，不是加分項：
#     · navigator.geolocation      只在安全情境下可用
#     · DeviceOrientation（羅盤）  同上，而且 iOS 還要額外授權
#   HANDOFF §12.6 記著「羅盤只在安全情境有效」—— 上了 https 那條就解決了。
#
# 本檔只寫 80 埠；跑過 `sudo certbot --nginx` 後，certbot 會自動補上 443 區塊、
# 憑證路徑，以及 80 → 443 跳轉，並設定每日自動續約。不要手動改它加的那幾行。
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # ★ 我們沒有任何上傳（照片不上傳、不保存，企劃書 §7）。
    #   對話請求最大也就幾 KB，64K 綽綽有餘。
    client_max_body_size 64k;

    # ── 地圖圖磚：交給 node，但讓瀏覽器好好快取 ──────────────
    #
    # 630 張 PNG、單張約 5–6KB，一次視野載約 9 張。量不大，
    # 所以**不做 nginx 直接讀檔**——那要讓 www-data 讀得到家目錄，
    # 而放寬家目錄權限是一個為了省幾毫秒而打開的洞。
    #
    # 圖磚是離線光柵化的產物，內容改變一定伴隨重新部署，所以可以放心長快取。
    location /map/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # ★ adapter-node 靠這個 header 決定 cookie 的 Secure 與 url.protocol。
        #   少了它，https 下簽出來的 cookie 會被當成 http 的。
        proxy_set_header X-Forwarded-Proto $scheme;

        # SvelteKit 的 SSR 很快，但 AI 對話那一支最長要等 8 秒（SDD §6.5 的逾時）
        # 加上重試一次換模型，抓 30 秒當保險絲。
        proxy_read_timeout    30s;
        proxy_connect_timeout 10s;
    }
}
