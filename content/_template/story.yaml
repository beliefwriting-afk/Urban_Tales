# 劇情範本 —— content/sites/<site-id>/story.yaml
#
# ★★★ 只有 site.yaml 標了 hasStory: true 的站才有這個檔。★★★
#   標了卻沒有 → content:check #11 擋下來；沒標卻放了 → 一樣擋下來。
#   （劇情內容躺在資料夾裡卻永遠不會被玩家看到，是最難發現的那種錯。）
#
# ★ 一站一份，順序在 site.yaml 的 storyOrder，不在這裡。
#   那是「這一站在線上的位置」，屬於景點，不屬於劇情內容。
#
# ★ 沒有 nodes[] 也沒有 next 指標——這條線沒有分支。理由見 content/schema.ts
#   的 StorySchema 說明。哪天真的要分支，那時候再改 schema。
#
# ⚠️ 劇情台詞是**預寫的成品，一個字都不經 AI**（企劃書 §4.3：措辭即成品）。
#   全域護欄八條照樣適用，而且要對得上該站 soul.yaml 的 voice
#   ——同一個靈魂在劇情裡跟在對話裡必須是同一個人。
#
# ⚠️ 史實引用要對得上該站的 materials.yaml。說不清的事要留活口，
#   素材庫沒有的東西不要在劇情裡憑空生出來。

siteId: your-site-id

# ── 任務視窗裡的那一欄 ────────────────────────────────────────
#
# summary 要能讓一個放了三天才回來的玩家知道「我現在該去哪、該做什麼」。
# 它不是劇情摘要，是提醒。
quest:
  title:
    zhHant: 某某的遺願 (1)
    en: null
    ja: null
  summary:
    zhHant: 一句話：現在該做什麼。
    en: null
    ja: null

# ── 劇情期間 L2 多出來的那個選項 ──────────────────────────────
#
# ★ 獨立一列，不併進三題引導提問——它按下去回的是下面的預寫台詞，
#   跟那三題（走 AI）不是同一種東西，長得一樣會誤導玩家。
# ⚠️ 一樣建議短，它是按鈕。
entry:
  text:
    zhHant: 我這裡有樣東西，您可以幫幫我嗎？
    en: null
    ja: null

# ── 靈魂的回應 ────────────────────────────────────────────────
#
# 呈現方式：對話框先出現一張回憶卡（標題＋引句＋未讀驚嘆號），
# 點開才是全螢幕閱讀視窗。★ 關閉視窗才算這一站完成。
response:
  card:
    # ⚠️ 引句是卡面上唯一露出的台詞，**不得劇透**。
    title:
      zhHant: 卡面標題
      en: null
      ja: null
    quote:
      zhHant: 台詞裡的一句，不劇透。
      en: null
      ja: null
  # ★ 一段一個元素。分段是節奏，不是排版——該自己站一段的句子就讓它自己站。
  body:
    - zhHant: 第一段。
      en: null
      ja: null
    - zhHant: 第二段。
      en: null
      ja: null

# ── 這個任務的道具（可以沒有，寫 null）──────────────────────────
#
# 取得時機是機制不是內容：任務 (1) 的道具在首次進入該站 L2 時取得，
# 其餘在前一個任務完成時取得。
item:
  id: some-item
  name:
    zhHant: 某樣東西
    en: null
    ja: null
  body:
    - zhHant: 道具說明，跟劇情回應共用同一個閱讀器。
      en: null
      ja: null
  # 有圖就填路徑，還沒有就留 null（先用文字描述，圖後補）
  art: null

# ── 劇情走完之後才追加進人格的一段（可以是 null）────────────────
#
# ★★★ 這一格是「劇情不劇透」的機制。★★★
#
# 玩家在劇情中可以自由發問（走 speak()）。如果靠「叮嚀模型不要提前講」，
# 那是一條寫在 prompt 裡、可以被繞過的規則。
# 改成「走完之前根本不給它這段記憶」——模型想劇透也無從劇透。
# **不是要求它不說，是它不知道。**
afterStory:
  zhHant: 劇情走完後，這個靈魂才「想得起來」的事。
  en: null
  ja: null
