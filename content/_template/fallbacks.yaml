# 保底台詞範本 —— content/sites/<site-id>/fallbacks.yaml
#
# ★★★ 企劃書 §4.3：措辭即成品，需逐字審。★★★
#
# 這些是 AI 失效時玩家真正會看到的字。企劃書 §8.7 要求
# 「AI 失效一律回退預寫台詞，且視為正常回應，不呈現為錯誤」——
# 所以它們必須寫成「這個角色會說的話」，不是系統訊息。
#
#   ❌ 反例：「抱歉，我現在無法回答。」
#   ✅ 正例（龍山寺）：「那邊在誦經，你的話我漏了幾個字。再一次。」
#
# 每種情境至少 3 句（quotaReached 至少 2 句），隨機選，
# 避免玩家連續遇到同一句而察覺異常。
#
# ── 四條寫作判準（六站共用，但**句子不共用**）─────────────────
#
#  ① **失效的理由用場域裡的聲音或這個角色自己的狀態。**
#     玩家不該從台詞裡推得出來是 AI 掛了、還是額度用完了。
#     每站的理由要不一樣——六站都寫「太吵」就露餡了。
#
#  ② ★★★ **aiUnavailable 至少要有一句不把球丟回給玩家。** ★★★
#     這一組同時覆蓋 L4 全域成本上限觸頂（SDD §10.1），而 L4 會持續到
#     隔日 UTC+8 00:00。如果三句都是「我沒聽清，再說一次」，玩家重問兩輪
#     就會斷定「程式壞了」——而 SDD 要的效果是「這位靈魂今天話少一點」。
#     所以每站至少要有一句是**收掉回合**的說法，不要求重講。
#
#  ③ **不能假設玩家人在現場。** 實地模式與展示模式看到的是同一組字，
#     而展示模式的玩家往往連台北都不在——不寫「你先在外面走走」「你抬頭看」
#     「你熱不熱」這種話。⚠️ 人格卡允許的現場關心（走 AI，拿得到 presenceMode）
#     **不能照抄進保底台詞**，這裡是兩種模式共用的同一組死字。
#
#  ④ **拒絕要給替代**，而且替代要**兌現得了**——只能指向 materials.yaml 有的東西。
#
# ⚠️ **L4 全域上限走 aiUnavailable，不是 quotaReached**（SDD §10.1、`speak.ts` 第 4 步）。
#    全域沒錢是我們的營運狀態，不是玩家做錯事。
#    quotaReached 只給 L3——每玩家每日（實地 120 則／展示 40 則）。
#    ★ 實地很難打到 120，真正會看到它的多半是**展示模式**的人。

siteId: your-site-id

lines:
  # AI 呼叫失敗／逾時。★ 全域額度用盡時也走這一組（SDD §6.5 第 5 階）——
  #   全域沒錢是營運狀態，不該讓玩家知道
  aiUnavailable:
    - zhHant: 台詞一
      en: null
      ja: null
    - zhHant: 台詞二
      en: null
      ja: null
    - zhHant: 台詞三
      en: null
      ja: null

  # 玩家問到禁忌主題（解籤、吉凶、教義比較…）
  refusal:
    - zhHant: 台詞一
      en: null
      ja: null
    - zhHant: 台詞二
      en: null
      ja: null
    - zhHant: 台詞三
      en: null
      ja: null

  # 玩家問的事素材庫沒有
  unknown:
    - zhHant: 台詞一
      en: null
      ja: null
    - zhHant: 台詞二
      en: null
      ja: null
    - zhHant: 台詞三
      en: null
      ja: null

  # 玩家自己的每日額度用盡
  quotaReached:
    - zhHant: 台詞一
      en: null
      ja: null
    - zhHant: 台詞二
      en: null
      ja: null

  # 玩家離題（問天氣、問你是不是 AI…）
  offTopic:
    - zhHant: 台詞一
      en: null
      ja: null
    - zhHant: 台詞二
      en: null
      ja: null
    - zhHant: 台詞三
      en: null
      ja: null
