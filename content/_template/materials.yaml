# 地方故事素材庫範本 —— content/sites/<site-id>/materials.yaml
#
# ★★★ 這是靈魂「知道的事」的全部來源。素材庫沒有的，它就不該講得斬釘截鐵。★★★
#
# 【2026-09-04 改版】原本是一個 items 陣列、每條標 kind（已知史實／民間傳說／
# 角色想像）＋ topic。現在是兩塊：**一段 facts ＋ 幾條 legends**。
#
# ★ 為什麼分成兩塊，而不是全部寫成一段：
#   這個區分決定靈魂**用什麼語氣講一句話**——
#     facts   → 可以講得斬釘截鐵
#     legends → 必須留活口（「有一種說法是⋯⋯，也有人說⋯⋯」）
#   混成一段的話，模型分不出哪句該篤定、哪句該留餘地。
#   （企劃書 §4.2 第 5 條：不對敏感歷史武斷定論。）
#
# ★ 「角色想像」不在這裡。那不是素材，是**權限**——「這個靈魂可以描述哪些
#   沒被記錄下來的東西」寫在 soul.yaml 的 persona.knows。素材庫只放查得到的事。

siteId: your-site-id

# ── 一段史實 ──────────────────────────────────────────────────
#
# ⚠️ **整段會逐字進 system prompt。措辭即成品，要逐字審。**
#
# 寫法建議：
#   · 寫成連貫的敘述，不要寫成條列——模型會把連貫的段落講成連貫的話，
#     條列進去，出來也像條列。
#   · 年代、人名、用途變遷這類「查得到的事」放這裡。
#   · 寫到「有一種說法」「據說」「相傳」的時候停下來——那句話該搬去 legends。
#     （content:check #3 會唸你。）
facts:
  zhHant: |
    這裡是什麼時候蓋的、誰蓋的、為什麼蓋。中間換過哪些用途，每一次是為什麼換。
    現在是什麼樣子。

    寫成一段連貫的敘述，讓靈魂讀得懂這個地方的來龍去脈，而不是拿到一堆碎片。
  en: null
  ja: null

# 上面那段史實的出處，**至少一個**（content:check #3 會擋）。
#
# ⚠️ 出處不進 prompt、也不給玩家看。它存在的唯一理由是讓審內容的人查得到
#   每一句話從哪來。所以「網路」「維基」這種等於沒寫，會被擋下來。
sources:
  - 機關公告／館方紀錄／研究文獻的具體名稱

# ── 民間傳說 ──────────────────────────────────────────────────
#
# 凡是「有人這樣說，但沒有定論」的放這裡：地名由來的各種說法、
# 對形狀的象徵解釋、誰蓋的傳聞⋯⋯
#
# 可以是空的，但空的要是刻意的——content:check #4 會把空的站唸出來，
# 因為幾乎每個有年代的地方都有說不清的東西，空著通常表示還沒想過。
legends:
  - id: example-legend
    text:
      zhHant: 有一種說法是⋯⋯，但也有人說⋯⋯。兩種都寫進去，讓靈魂知道這件事沒有定論。
      en: null
      ja: null
    # 傳說可以沒有出處，那正是它是傳說的原因
    source: null
