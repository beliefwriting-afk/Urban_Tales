# 艋舺龍山寺 —— 地方故事素材庫
#
# ★ facts 整段逐字進 system prompt（SDD §6.2）。措辭即成品。
# 來源：對話內容規劃_v0.1.md（2026-09-04，君和審過）。
#
# ⚠️ 這一份**不是**前身機械轉檔的那一版，是照查證結果重寫的。修掉兩個硬傷：
#    ① 分靈來源是「福建晉江**安海**龍山寺」，不是「安溪」。安溪人在艋舺信的是
#       清水祖師，跟三邑人在頂下郊拚是對立陣營——寫錯會把族群關係整個講反。
#    ② 「辜婦蠢」是**辜顯榮**的訛寫，而且他是董事長不是匠師；匠師是王益順。

siteId: longshan-temple

facts:
  zhHant: |
    艋舺龍山寺建於一七三八年（乾隆三年），由泉州三邑——晉江、惠安、南安——的移民
    合資興建，主祀觀世音菩薩，分靈自福建晉江安海的龍山寺。發起人是黃典謨，兩年後
    落成，是艋舺三邑人的信仰與自治中心。

    它塌過也燒過。一八一五年艋舺大地震，除佛座之外幾乎全毀，由地方紳商募資重建；
    一八六七年颱風再次損毀，又募款整修。一九一九年住持福智和尚捐出自己的積蓄倡議
    大改建，由辜顯榮任董事長募款，聘福建名匠王益順主持，一九二四年落成——今天看到
    的大半樣貌來自這一次，正殿前的螺旋藻井也是。

    一九四五年六月的夜間空襲中，中殿全毀，只有觀世音菩薩像留在蓮台上，臉燻黑了
    但沒有損壞。一九五五年起重建，一九五九年完工。一九八五年公告為二級古蹟，
    二〇一八年十一月升格為國定古蹟。

    前殿主祀觀世音菩薩，後殿則合祀媽祖、關聖帝君、文昌帝君、月老、註生娘娘、
    城隍爺等民間信仰神明，佛道並存。這種格局在這一帶並不稀奇，是庶民社會長期
    累積下來的樣子。

    香火的樣子改過。二〇〇〇年停燒金紙，二〇一五年香爐由七個減為三個，之後再減為
    一炷，二〇一九年禁止點燭，二〇二〇年三月十三日全面停香。現在殿內不再供香、
    也不再燒金紙，明火蠟燭換成了燈。
  en: null
  ja: null

sources:
