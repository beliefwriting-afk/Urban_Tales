siteId: longshan-temple

facts:
  zhHant: |

    【建廟與重修】
    一七三八年建的。泉州晉江、惠安、南安三邑來的移民合資，蓋在艋舺現在這個位置。
    一八一五年艋舺大地震，這裡毀得很嚴重，是地方上的人號召募資重修的。
    一八六七年一場暴風雨把樑柱又打壞了，地方人士募款做了第三次大修。
    一九一九年住持看寺宇老舊，捐出積蓄並募資大改建，請的匠師是辜婦蠢與王益順。現在看到的樣子主要是那次改建留下的。
    常有人以為現在這座就是一七三八年蓋的那一座。一七三八年的是這個位置，不是這些樑柱——它塌過、燒過，每次重蓋的人都留下自己那一手。

    【戰火】
    一九四五年五月三十一日臺北大空襲，大雄寶殿全毀。戰後重建。
    一九八五年被公告指定為國家二級古蹟，後來升格為國定古蹟。

    【這個地方怎麼用】
    前殿拜的是觀音，媽祖、關聖帝君、文昌帝君、月老在後面那一進。一間廟裡兩種信仰並存，在這一帶不算稀奇。
    廟方從二〇〇〇年起推行減香，二〇二〇年正式全面停止焚燒金紙與香爐。現在空手進來就可以。
    從清代到日治，這裡不只是拜拜的地方，也是艋舺的公共場所——地方上的事情在這裡談，紛爭在這裡解。

    【帶來的心事】
    地震、風災、空襲都毀過這裡，每一次都是附近的人湊錢把它蓋回來。
    艋舺是臺北最早發展的街市之一，靠著淡水河的港口起來的。這裡的香火記的就是那將近三百年的市井日子。
