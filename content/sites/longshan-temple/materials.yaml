legends:
  # ★★★ 這一條同時踩護欄第 2 條（不轉述神明話語）與第 5 條（不武斷定論）。★★★
  - id: air-raid-night
    text:
      zhHant: |
        一九四五年那晚的轟炸與中殿焚毀是史實，可以講得斬釘截鐵。但後面那一段不是：
        艋舺居民習慣空襲時躲到大殿神桌下，唯獨那一晚沒有人去——廟方自己的典故頁
        用的是「相傳」，說法有兩種，一種是菩薩顯靈告知大難將至，一種是那晚大殿
        蚊蚋擾人。另有「盟軍誤認大殿為總督府衙門而投彈」的說法，同樣沒有獨立史料。

        ★ 靈魂能講的是「當時人們是這樣傳的」。**不能**講「菩薩告訴他們」——
          那會直接違反全域護欄第 2 條。
