# 艋舺龍山寺 —— 地方故事素材庫
#
# ★★★ 三站中內容治理風險最高的一站（唯一的宗教場域）。★★★
#
# 企劃書 §4.2 第 2、3、4 條在這裡特別吃重：
#   不轉述神明的話語、不作教義性陳述或裁決、不是廟方人員也不是宗教解說員。
# 下面每一條素材都刻意寫成「這個地方看見的事」，不是「這個信仰是什麼」。
#
# 來源：轉自前身專案 City_Soul_AI 的 content/landmarks/longshan_temple.yaml。
#
# ⚠️ 君和：這一份要逐字審，而且要用最嚴的標準。

siteId: longshan-temple

items:
  # ── 建廟與重修 ────────────────────────────────────────
  - id: founding-1738
    kind: 已知史實
    topic: 建廟與重修
    text:
      zhHant: 一七三八年建的。泉州晉江、惠安、南安三邑來的移民合資，蓋在艋舺現在這個位置。
      en: null
      ja: null
    source: 文化部文化資產局／廟誌

  - id: quake-1815
    kind: 已知史實
    topic: 建廟與重修
    text:
      zhHant: 一八一五年艋舺大地震，這裡毀得很嚴重，是地方上的人號召募資重修的。
      en: null
      ja: null
    source: 龍山寺官方沿革

  - id: storm-1867
    kind: 已知史實
    topic: 建廟與重修
    text:
      zhHant: 一八六七年一場暴風雨把樑柱又打壞了，地方人士募款做了第三次大修。
      en: null
      ja: null
    source: 文化部文化資產局

  - id: rebuild-1919
    kind: 已知史實
    topic: 建廟與重修
    text:
      zhHant: 一九一九年住持看寺宇老舊，捐出積蓄並募資大改建，請的匠師是辜婦蠢與王益順。現在看到的樣子主要是那次改建留下的。
      en: null
      ja: null
    source: 龍山寺沿革簡介

  - id: not-original-1738
    kind: 已知史實
    topic: 建廟與重修
    text:
      zhHant: 常有人以為現在這座就是一七三八年蓋的那一座。一七三八年的是這個位置，不是這些樑柱——它塌過、燒過，每次重蓋的人都留下自己那一手。
      en: null
      ja: null
    source: 龍山寺沿革簡介／臺灣歷史辭典

  # ── 戰火 ──────────────────────────────────────────────
  - id: airraid-1945
    kind: 已知史實
    topic: 戰火
    text:
      zhHant: 一九四五年五月三十一日臺北大空襲，大雄寶殿全毀。戰後重建。
      en: null
      ja: null
    source: 臺灣歷史辭典／龍山寺志

  - id: heritage-1985
    kind: 已知史實
    topic: 戰火
    text:
      zhHant: 一九八五年被公告指定為國家二級古蹟，後來升格為國定古蹟。
      en: null
      ja: null
    source: 文化部國家文化資產網

  # ── 這個地方怎麼用 ────────────────────────────────────
  - id: multi-deity
    kind: 已知史實
    topic: 這個地方怎麼用
    text:
      zhHant: 前殿拜的是觀音，媽祖、關聖帝君、文昌帝君、月老在後面那一進。一間廟裡兩種信仰並存，在這一帶不算稀奇。
      en: null
      ja: null
    source: 廟誌／文化部文化資產局

  - id: incense-reform
    kind: 已知史實
    topic: 這個地方怎麼用
    text:
      zhHant: 廟方從二〇〇〇年起推行減香，二〇二〇年正式全面停止焚燒金紙與香爐。現在空手進來就可以。
      en: null
      ja: null
    source: 龍山寺廟方公告／新聞

  - id: self-governance
    kind: 已知史實
    topic: 這個地方怎麼用
    text:
      zhHant: 從清代到日治，這裡不只是拜拜的地方，也是艋舺的公共場所——地方上的事情在這裡談，紛爭在這裡解。
      en: null
      ja: null
    source: 臺灣歷史辭典／龍山寺志

  # ── 帶來的心事 ────────────────────────────────────────
  - id: what-people-bring
    kind: 角色想像
    topic: 帶來的心事
    text:
      zhHant: 人們把心事帶到這裡：求一段姻緣、求一個孩子考上、求家裡那個人快點好起來。這個地方記得的是那些人站在那裡的樣子，不是誰後來如願了。
      en: null
      ja: null
    source: null

  - id: rebuilt-by-neighbours
    kind: 已知史實
    topic: 帶來的心事
    text:
      zhHant: 地震、風災、空襲都毀過這裡，每一次都是附近的人湊錢把它蓋回來。
      en: null
      ja: null
    source: 龍山寺官方沿革／臺灣歷史辭典

  - id: mengjia-context
    kind: 已知史實
    topic: 帶來的心事
    text:
      zhHant: 艋舺是臺北最早發展的街市之一，靠著淡水河的港口起來的。這裡的香火記的就是那將近三百年的市井日子。
      en: null
      ja: null
    source: 臺灣歷史辭典／龍山寺志
