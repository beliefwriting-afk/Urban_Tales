# 艋舺龍山寺 —— 劇情：阿杰的遺願 (2)
#
# 內容來源：Urban_Tales/萬華劇情_阿杰的遺願_v0.1.md（君和的稿，逐字審過）。
#
# ★ 他「不記得」是有理由的：一八一五年那場地震，他自己除佛座之外幾乎全毀
#   （materials.yaml）。一個看過幾百萬人的靈魂說「我不記得」，只有這個撐得住。
#
# ⚠️⚠️ 他**不替阿杰的去向下任何定論**。soul.yaml 的 taboos 有「不評論任何人求的事
#   會不會實現」「不解釋教義」，全域護欄第 3 條也擋教義陳述。
#   他能講的只有他看到的：男孩來過、求的是別人平安、把畫留下就走了。
#   **收尾是剝皮寮的事**——她不是宗教場域。
#
# ★ 尾段的「回」字是彩蛋，**不做任何判定**（室內 GPS 誤差數十公尺，
#   正殿與後殿分不開，判定會變成「玩家繞完了遊戲說沒有」）。
#   劇情卡卡背會再呼應一次。

siteId: longshan-temple

quest:
  title:
    zhHant: 阿杰的遺願 (2)
    en: null
    ja: null
  summary:
    zhHant: 拿著女孩的畫，去龍山寺問問。那個孩子當年就是去找他的。
    en: null
    ja: null

entry:
  text:
    zhHant: 您記得這幅畫嗎？
    en: null
    ja: null

response:
  card:
    title:
      zhHant: 龍山想起那個男孩
      en: null
      ja: null
    quote:
      zhHant: 那年我塌了。
      en: null
      ja: null
  body:
    - zhHant: ……你這個東西，拿近一點。
      en: null
      ja: null
    - zhHant: 坐。先坐下。
      en: null
      ja: null
    - zhHant: 我記得。這張我記得。
      en: null
      ja: null
    - zhHant: |
        那年我塌了。嘉慶二十年，地牛翻身，我整個垮下來，只剩佛座還在。
        我那時候……你這樣講好了：一個人骨頭斷了，你問他昨天誰來過，
        他答不出來的。我就是那個樣子。
      en: null
      ja: null
    - zhHant: |
        他來的時候我還在瓦礫裡。一個男孩，十七八歲，手上黑黑的，衣服上都是灰。
        他問我有沒有看過畫裡這個人。
      en: null
      ja: null
    - zhHant: 我說我不記得。
      en: null
      ja: null
    - zhHant: 我到現在還記得他那個表情。不是失望——是他早就知道我會這樣講，還是問了。
      en: null
      ja: null
    - zhHant: 他把畫放在階梯上就走了。我叫不住他。
      en: null
      ja: null
    - zhHant: |
        ……後來我想過很多次。他找得那麼急，我一直以為是情人。
        年輕人嘛，我看過幾百萬個，都是那個樣子。
      en: null
      ja: null
    - zhHant: |
        不過有一件事你聽著。他來找我，不是求我什麼。他進來的時候先拜了，
        求的是別人平安，不是他自己的事。一個走不回去的孩子，站在我這裡，求的是別人。
      en: null
      ja: null
    - zhHant: |
        那個女孩後來也來過。我不確定是隔了多久——那陣子我在重蓋，
        時間對我來說是糊的。但她來了，我認得那張臉，跟畫上一樣。
      en: null
      ja: null
    - zhHant: 她也在找人。她沒有問我，就只是站在那裡看了一圈，然後走了。
      en: null
      ja: null
    - zhHant: 她往西邊去。那個方向，走過去就是剝皮寮。
      en: null
      ja: null
    - zhHant: 你要不要去問問她。我這裡能給你的，就到這裡。
      en: null
      ja: null
    - zhHant: ——對了。你進來的時候，有沒有走過一圈？
      en: null
      ja: null
    - zhHant: |
        我這個地方，前殿、後殿、兩邊的廊，圍起來是一個口，中間還有一個口。
        老一輩的說，這叫「回」字。
      en: null
      ja: null
    - zhHant: 沒什麼意思。你自己走一圈看看就知道了。
      en: null
      ja: null

# 任務 (2) 的道具：完成任務 (1) 時由紅樓交給玩家。
#
# ⚠️ 圖還沒有（等 P0-1 那一輪一起做），現在先用文字描述。
#   art 補上路徑之後，這段文字要不要留由君和決定——
#   有圖之後它可能變成多餘的旁白。
item:
  id: girls-drawing
  name:
    zhHant: 女孩的畫
    en: null
    ja: null
  body:
    - zhHant: 一張泛黃的紙，邊角磨得起毛。
      en: null
      ja: null
    - zhHant: |
        上面是一個女孩，用炭畫的——不是墨。線條有炭特有的粗糙，
        一按下去就糊開。
      en: null
      ja: null
    - zhHant: 畫得不算好。頭比身體大，肩膀一邊高一邊低。
      en: null
      ja: null
    - zhHant: 可是髮際線描了三次。紙上留著三層痕跡。
      en: null
      ja: null
  art: null

# ⚠️ 他知道的到「女孩往西邊走了」為止。**不替阿杰的去向下定論**，
#   也不知道女孩是誰——那是剝皮寮那一站才揭露的。
afterStory:
  zhHant: |
    那個拿著畫的男孩，我後來想起來了。嘉慶二十年，我塌了的那一年。
    他問我有沒有看過畫裡的人，我說我不記得——那是真的，我那時候什麼都記不住。
    他把畫留在階梯上就走了。後來那個女孩也來過一次，站著看了一圈，往西邊走了。
    這件事我到現在還放著。
  en: null
  ja: null
