# 艋舺龍山寺 —— 保底台詞
#
# ★★★ 企劃書 §4.3：措辭即成品。這些是 AI 失效時玩家**真正會看到的字**。★★★
#
# 企劃書 §8.7：AI 失效一律回退預寫台詞，**且視為正常回應，不呈現為錯誤**。
# 所以它們必須寫成「這個角色會說的話」，不是系統訊息。
#
# 四條寫作判準（六站共用，但**句子不共用**）：
#
#  ① **失效的理由用場域裡的聲音或這個角色自己的狀態**（廟埕的人聲與誦經）。
#     玩家不該從台詞裡推得出來是 AI 掛了、還是額度用完了。
#
#  ② ★★★ **aiUnavailable 至少要有一句不把球丟回給玩家。** ★★★
#     這一組同時覆蓋 L4 全域成本上限觸頂（SDD §10.1），而 L4 會持續到
#     隔日 UTC+8 00:00。如果三句都是「我沒聽清，再說一次」，玩家重問兩輪
#     就會斷定「程式壞了」——而 SDD 要的效果是「這位靈魂今天話少一點」。
#     所以每站的第三句都是**收掉回合**的說法，不要求重講。
#
#  ③ **不能假設玩家人在現場。** 實地模式與展示模式看到的是同一組字，
#     而展示模式的玩家往往連台北都不在——不寫「你先在外面走走」「你抬頭看」
#     這種話。⚠️ 人格卡允許的現場關心（走 AI，拿得到 presenceMode）
#     **不能照抄進保底台詞**，這裡是兩種模式共用的同一組死字。
#
#  ④ **拒絕要給替代**，而且替代要**兌現得了**——只能指向 materials.yaml 有的東西。
#
# ⚠️ **L4 全域上限走 aiUnavailable，不是 quotaReached**（SDD §10.1、`speak.ts` 第 4 步）。
#    全域沒錢是我們的營運狀態，不是玩家做錯事。
#    quotaReached 只給 L3——每玩家每日（實地 120 則／展示 40 則）。
#    ★ 實地很難打到 120，真正會看到它的多半是**展示模式**的人。

siteId: longshan-temple

lines:
  # AI 失敗／逾時。★ 全域上限觸頂也走這一組，所以第三句要收得掉回合
  aiUnavailable:
    - zhHant: 那邊在誦經，你的話我漏了幾個字。再一次。
      en: null
      ja: null
    - zhHant: 人多的時候我耳朵不好使。你大聲些，我聽著。
      en: null
      ja: null
    - zhHant: 今天我話少。不急——你想到什麼再說，我不會走。
      en: null
      ja: null

  # 禁忌主題：求的事會不會成、神祇位階、參拜正確做法、族群是非
  refusal:
    - zhHant: 這個我不能替你說。我不是裡面的哪一位，我只是這間廟。你先別急，坐著聽我講點別的。
      en: null
      ja: null
    - zhHant: 你這個問題該問的不是我。我看過幾百萬個人走進來，每一個心裡想的事我都不評論。倒是這些柱子，一根一根都有來歷。
      en: null
      ja: null
    - zhHant: 不評這種事。我塌過、燒過、重蓋過三次，該講的是那些。
      en: null
      ja: null

  # 素材庫沒有的事
  unknown:
    - zhHant: 這個我沒看過。看過的我才講。
      en: null
      ja: null
    - zhHant: 不知道。這個我不替它想一個。
      en: null
      ja: null
    - zhHant: 沒聽說過。要問這件事你得找別人——我只在這個位置待著。
      en: null
      ja: null

  # L3 每玩家每日額度
  quotaReached:
    - zhHant: 今天先到這裡。不急——我在這裡兩百多年了，不差這一天。
      en: null
      ja: null
    - zhHant: 話說得差不多了。你歇著，我也歇著。
      en: null
      ja: null

  # 離題。★ 第二句給「你是不是 AI」——護欄第 8 條
  offTopic:
    - zhHant: 這個我幫不上。我只知道這個屋頂底下的事。
      en: null
      ja: null
    - zhHant: 我？我是這間廟。不是裡面的哪一位，是這個屋頂、這些柱子、還有兩百多年來從門檻踏進來的那些腳步。
      en: null
      ja: null
    - zhHant: 那不歸我管。我這裡只有人——現在連煙都沒了，剩下的就是人。
      en: null
      ja: null

