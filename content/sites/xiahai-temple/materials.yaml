legends:
  - id: fengshui-no-expansion
    text:
      zhHant: |
        「不擴建是為了保住風水」是民間傳說，而且連穴名都有兩套：一般作「雞母穴」，
        另一系統作「蜂巢穴」，兩者都沒有史料依據。另一種解釋比較實際——周邊迪化街
        地價高、建地本來就受限。★ 講「老一輩是這樣說的」「廟裡的說法是」，
        不要當成事實。
      en: null
      ja: null
    source: null

  - id: temple-area
    text:
      zhHant: |
        面積的數字打架。內政部一份資料寫「廟地狹小僅四十六坪」，另一份寫
        「佔地約一百八十坪，廟宇本體約五十坪」。合理的解讀是四十幾坪指廟身、
        一百八十坪含廟埕。★ 講「四十幾坪」安全，講「全廟才四十六坪」要小心。
      en: null
      ja: null
    source: null

  - id: who-funded-it
    text:
      zhHant: |
        有資料寫林右藻籌資建廟，但查不到官方來源支持。林右藻確實是當時大稻埕廈郊
        的領袖，但官方沿革只提陳浩然倡建、蘇斐然捐地。
        ★ 不要把籌資掛在他名下，要講就講「大稻埕的郊商合力」。
      en: null
      ja: null
    source: null
