# 臺北霞海城隍廟 —— 地方故事素材庫
#
# ★ facts 整段逐字進 system prompt（SDD §6.2）。措辭即成品。
# 來源：對話內容規劃_v0.1.md（2026-09-04，君和審過）。
#
# ⚠️ 有資料寫「林右藻籌資建廟」，查不到官方來源支持，**沒有寫進 facts**。
#    官方沿革只提陳浩然倡建、蘇斐然捐地。
# ⚠️ 頂下郊拚只講「同安人退到大稻埕」這個事實，不作族群是非定性。

siteId: xiahai-temple

facts:
  zhHant: |
    一八二一年，一百多名泉州同安人渡海抵達艋舺，其中的商人陳金絨奉請家鄉福建
    同安下店鄉霞城的城隍金身同行，供奉在艋舺八甲庄。「霞海」這個名字，來自霞城
    的臨海門。

    一八五三年艋舺發生頂下郊拚，同安人敗退，八甲庄毀於火中。信徒從火裡搶出城隍
    金身退到大稻埕，途中殉難的有三十八位，就是後來配祀在廟西側的三十八義勇公。

    一八五六年三月動工，一八五九年落成於迪化街現址，由陳浩然倡建、蘇斐然捐地。
    廟身只有四十幾坪，卻成了大稻埕郊商經濟與信仰的中心。一九八五年由內政部指定為
    三級古蹟，文資法修正後改列直轄市定古蹟。

    廟裡的神像曾經多達六百餘尊，是全臺神像密度最高的廟。一九七一年，一位老太太
    為子女的姻緣向城隍爺祈願，之後還願捐了一尊四十三公分高的月下老人神像，
    從那以後這裡就以求姻緣聞名。

    農曆五月十一、十二日暗訪，五月十三日遶境，就是「大稻埕迎城隍」，俗諺說
    「北港迎媽祖，臺北迎城隍」。這個習俗從一八七九年至今一百四十多年，
    二〇一〇年七月二十六日由臺北市政府登錄為無形文化資產，登錄名稱是「台北霞海
    城隍廟五月十三迎城隍」，類別是民俗。近年城隍文化祭也和迪化街年貨大街、
    大稻埕夏日節連在一起辦。
  en: null
  ja: null

