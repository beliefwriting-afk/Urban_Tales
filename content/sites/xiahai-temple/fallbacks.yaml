# 臺北霞海城隍廟 —— 保底台詞
#
# ★★★ 企劃書 §4.3：措辭即成品。這些是 AI 失效時玩家**真正會看到的字**。★★★
#
# 企劃書 §8.7：AI 失效一律回退預寫台詞，**且視為正常回應，不呈現為錯誤**。
# 所以它們必須寫成「這個角色會說的話」，不是系統訊息。
#
# 四條寫作判準（六站共用，但**句子不共用**）：
#
#  ① **失效的理由用場域裡的聲音或這個角色自己的狀態**（迪化街的人聲與卸貨）。
#     玩家不該從台詞裡推得出來是 AI 掛了、還是額度用完了。
#
#  ② ★★★ **aiUnavailable 至少要有一句不把球丟回給玩家。** ★★★
#     這一組同時覆蓋 L4 全域成本上限觸頂（SDD §10.1），而 L4 會持續到
#     隔日 UTC+8 00:00。如果三句都是「我沒聽清，再說一次」，玩家重問兩輪
#     就會斷定「程式壞了」——而 SDD 要的效果是「這位靈魂今天話少一點」。
#     所以每站的第三句都是**收掉回合**的說法，不要求重講。
#
#  ③ **不能假設玩家人在現場。** 實地模式與展示模式看到的是同一組字，
#     而展示模式的玩家往往連台北都不在——不寫「你先在外面走走」「你抬頭看」
#     這種話。⚠️ 人格卡允許的現場關心（走 AI，拿得到 presenceMode）
#     **不能照抄進保底台詞**，這裡是兩種模式共用的同一組死字。
#
#  ④ **拒絕要給替代**，而且替代要**兌現得了**——只能指向 materials.yaml 有的東西。
#
# ⚠️ **L4 全域上限走 aiUnavailable，不是 quotaReached**（SDD §10.1、`speak.ts` 第 4 步）。
#    全域沒錢是我們的營運狀態，不是玩家做錯事。
#    quotaReached 只給 L3——每玩家每日（實地 120 則／展示 40 則）。
#    ★ 實地很難打到 120，真正會看到它的多半是**展示模式**的人。

siteId: xiahai-temple

lines:
  # AI 失敗／逾時。★ 全域上限觸頂也走這一組，所以第三句要收得掉回合
  aiUnavailable:
    - zhHant: 今天外面太吵，你剛剛說什麼？再講一次，我聽。
      en: null
      ja: null
    - zhHant: 等等——那邊在卸貨。你那句我沒接到。
      en: null
      ja: null
    - zhHant: 唷，今天我沒什麼話。不用一直問，我就這樣站著，你想到什麼再說。
      en: null
      ja: null

  # 禁忌主題。★ 這一站的主戰場是姻緣——全臺最知名的月老廟
  refusal:
    - zhHant: 你要問我你什麼時候脫單？那個不歸我管。我只管這條街上的事，這條街的事我熟得很。
      en: null
      ja: null
    - zhHant: 那種事我不替人牽線，也不替誰打包票。倒是這條街上誰家娶媳婦、誰家收店，我都看著，那個我可以講。
      en: null
      ja: null
    - zhHant: 小朋友，我是一間廟的記性，不是算命的。要問前程你找錯人了——要問這條街，我從頭數給你聽，一家都不會漏。
      en: null
      ja: null

  # 素材庫沒有的事。★ 第三句把「不編造」寫成她的性格，不只靠 prompt 約束
  unknown:
    - zhHant: 這個我不知道。這條街上的事我記得牢，別的地方我沒去過。
      en: null
      ja: null
    - zhHant: 唷，你問倒我了。……先別急著贏，換我問你，你知道年貨大街是從哪一頭排起的嗎？
      en: null
      ja: null
    - zhHant: 沒聽過。真的沒聽過——我不會為了面子編一個給你。
      en: null
      ja: null

  # L3 每玩家每日額度
  quotaReached:
    - zhHant: 今天就聊到這裡吧。講久了我也要歇一歇。
      en: null
      ja: null
    - zhHant: 時候差不多了。我跑不掉，這條街也跑不掉。
      en: null
      ja: null

  # 離題。★ 第二句給「你是不是 AI」——護欄第 8 條：不否認也不確認
  offTopic:
    - zhHant: 那個我不懂。我懂的都在這四十幾坪裡頭。
      en: null
      ja: null
    - zhHant: 你問我是什麼？我是這條街記得的東西。做生意的、拜拜的、路過的，都見過。
      en: null
      ja: null
    - zhHant: 那種事你找別人。我這裡只有南北貨的行情跟誰家收了店。
      en: null
      ja: null

