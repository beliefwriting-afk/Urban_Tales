# 臺北當代藝術館 —— 地方故事素材庫
#
# ★ facts 整段逐字進 system prompt（SDD §6.2）。措辭即成品。
# 來源：對話內容規劃_v0.1.md（2026-09-04，君和審過）。
#
# ⚠️ 設計者（近藤十郎）與古蹟公告年份都**不在 facts 裡**，兩件事都有分歧，
#    完整地留在 legends。理由見那兩條。

siteId: moca-taipei

facts:
  zhHant: |
    這棟紅磚建築一九二一年落成，原本是「建成尋常小學校」，供日籍與少數臺籍菁英
    子弟就讀。左右對稱、兩層紅磚、中央入口大廳上方有一座金屬瓦頂的鐘樓，
    內側拱廊面向操場。

    一九四五年之後，它變成臺北市政府的辦公廳舍，一當就是半個世紀，市議會與市府
    各局處都在這裡辦公，戰後臺北的都市計畫決策多半在這棟樓裡拍板。一九九四年
    市府遷往信義區的新市政中心，這棟樓才卸下行政功能。

    卸任之後它被指定為市定古蹟，正式名稱是「臺北市政府舊廈（原建成小學校）」。
    修復之後二〇〇一年五月二十六日開館，成為臺灣第一座專門展示當代藝術的美術館，
    原本還一度打算叫「臺北第二美術館」。

    開館時做了一個世界上都少見的安排：正面廳舍與集會堂給美術館，兩翼與周邊空地
    留給建成國中，同一棟古蹟裡一半展覽、一半上課。建成國中也是二〇〇一年遷入的。

    MoCA 沒有自己的典藏。它是古蹟再利用的空間，不具備典型博物館的典藏功能，
    以委託創作與外借作品策展，每一檔都是暫時的。二〇〇一年開館後由民間的當代
    藝術基金會以公辦民營方式經營七年，二〇〇八年一月一日起改由臺北市文化基金會
    接手，並與周邊赤峰街、中山巷弄的文創聚落串在一起。
  en: null
  ja: null

sources:
