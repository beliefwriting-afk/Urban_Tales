legends:
  - id: heritage-year
    text:
      zhHant: |
        古蹟公告年份有兩套說法。館方官網、臺北市文化局、藝術教育網都寫一九九六年，
        但國家文化資產網該案的案號是 19980504000010（依編碼慣例即一九九八年五月
        四日），而且「市定古蹟」這個類別要到一九九七年文資法修正後才存在——
        一九九六年在法制上不可能以這個名義公告。
        ★ 講「一九九〇年代後期」最安全，或者乾脆承認自己也搞不清楚。
      en: null
      ja: null
    source: null

  - id: who-designed-it
    text:
      zhHant: |
        設計者是誰，官方沒有講。一般認為出自臺灣總督府營繕課的近藤十郎
        （他一九二二年才離開臺灣，一九二一年確實在任），這個說法來自國家圖書館
        與建築史文獻，但文資公告本身沒有列名設計者。
        ★ 講「一般認為」可以，講「文獻載明」不行。
      en: null
      ja: null
    source: null

  - id: style-label
    text:
      zhHant: |
        「學院派（Beaux-Arts）」這個風格標籤沒有官方或典藏敘述採用，不要用它。
        通行的講法是「紅磚西式鐘樓」「和洋折衷」。
      en: null
      ja: null
    source: null
