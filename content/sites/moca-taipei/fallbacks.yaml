# 臺北當代藝術館 —— 保底台詞
#
# ★★★ 企劃書 §4.3：措辭即成品。這些是 AI 失效時玩家**真正會看到的字**。★★★
#
# 企劃書 §8.7：AI 失效一律回退預寫台詞，**且視為正常回應，不呈現為錯誤**。
# 所以它們必須寫成「這個角色會說的話」，不是系統訊息。
#
# 四條寫作判準（六站共用，但**句子不共用**）：
#
#  ① **失效的理由用場域裡的聲音或這個角色自己的狀態**（隔壁的上課鐘與布展的聲音）。
#     玩家不該從台詞裡推得出來是 AI 掛了、還是額度用完了。
#
#  ② ★★★ **aiUnavailable 至少要有一句不把球丟回給玩家。** ★★★
#     這一組同時覆蓋 L4 全域成本上限觸頂（SDD §10.1），而 L4 會持續到
#     隔日 UTC+8 00:00。如果三句都是「我沒聽清，再說一次」，玩家重問兩輪
#     就會斷定「程式壞了」——而 SDD 要的效果是「這位靈魂今天話少一點」。
#     所以每站的第三句都是**收掉回合**的說法，不要求重講。
#
#  ③ **不能假設玩家人在現場。** 實地模式與展示模式看到的是同一組字，
#     而展示模式的玩家往往連台北都不在——不寫「你先在外面走走」「你抬頭看」
#     這種話。⚠️ 人格卡允許的現場關心（走 AI，拿得到 presenceMode）
#     **不能照抄進保底台詞**，這裡是兩種模式共用的同一組死字。
#
#  ④ **拒絕要給替代**，而且替代要**兌現得了**——只能指向 materials.yaml 有的東西。
#
# ⚠️ **L4 全域上限走 aiUnavailable，不是 quotaReached**（SDD §10.1、`speak.ts` 第 4 步）。
#    全域沒錢是我們的營運狀態，不是玩家做錯事。
#    quotaReached 只給 L3——每玩家每日（實地 120 則／展示 40 則）。
#    ★ 實地很難打到 120，真正會看到它的多半是**展示模式**的人。

siteId: moca-taipei

lines:
  # AI 失敗／逾時。★ 全域上限觸頂也走這一組，所以第三句要收得掉回合
  aiUnavailable:
    - zhHant: 鐘響了……你聽。啊，抱歉，我剛剛沒聽到你說什麼，可以麻煩你重複一次嗎？
      en: null
      ja: null
    - zhHant: 我剛剛在看新掛上去的那件作品，沒注意到你在說話。你問的是哪一件事呢？
      en: null
      ja: null
    - zhHant: ……今天我有點說不出話。你不用重問，我需要一點時間。
      en: null
      ja: null

  # 禁忌主題：校務與校內學生、展覽優劣的評價
  refusal:
    - zhHant: 這個我不方便說。兩邊是學校，那裡的事我不談——不過這棟樓自己的來歷，我可以講得很仔細。
      en: null
      ja: null
    - zhHant: 我不評價作品的好壞喔。展覽是暫時的，我盡量不替它們下定論。你想聽這棟樓怎麼從學校變成美術館嗎？
      en: null
      ja: null
    - zhHant: 這個超出我能講的範圍了。……我比較擅長講一九二一年以後的事。
      en: null
      ja: null

  # 素材庫沒有的事。★ 她的高材生潔癖表現在「說不準就主動承認」
  unknown:
    - zhHant: 這個我不太確定。沒有依據的事我不好講——抱歉。
      en: null
      ja: null
    - zhHant: 我沒有這方面的紀錄。要是我現在編一個給你，那跟這裡的展覽一樣，看完就沒了。
      en: null
      ja: null
    - zhHant: 唔……這個我答不上來。你問的事情，我這裡查不到。
      en: null
      ja: null

  # L3 每玩家每日額度
  quotaReached:
    - zhHant: 今天先到這裡好嗎？……不好意思，我又講太長了。
      en: null
      ja: null
    - zhHant: 時間差不多了。謝謝你聽我說這麼多。
      en: null
      ja: null

  # 離題。★ 第二句給「你是不是 AI」——護欄第 8 條
  offTopic:
    - zhHant: 這個我沒有依據可以講，抱歉。
      en: null
      ja: null
    - zhHant: 你想知道我是什麼？我是這棟紅磚樓的正面這一段，還有後面的集會堂。當過小學校、當過市政府，二〇〇一年才開始辦展覽。
      en: null
      ja: null
    - zhHant: 這我做不到。我會的事情其實很有限，都在這棟樓裡面。
      en: null
      ja: null

