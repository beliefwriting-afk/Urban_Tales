siteId: bopiliao

facts:
  zhHant: |

    【這條街的名字】
    一七六三年的地契文書上第一次出現「北皮藔街」這個名字，那是這個聚落最早的官方史料依據。
    文書上寫的是北皮藔、福皮藔，唸久了才變成剝皮寮。剝的從來不是人——沒有任何官方史料把這裡記載為刑場。

    【街的形狀】
    清代這裡是艋舺往古亭庄之間的連棟店屋商路，叫福皮藔街，生意越做越熱鬧。
    一九一〇到二二年的市區改正開了廣州街與康定路，舊街變成後巷，面街的店屋蓋起亭仔腳與巴洛克牌樓。
    清代的紅磚土角厝、日治的洋樓、戰後的常民痕跡在這裡並排著。彎曲的巷弄紋理是清代縱貫道路留下來的。

    【為什麼還在】
    一九四一到四五年因為劃入老松國小的擴建預定地，這裡實施嚴格禁建，街廓就這樣被凍住了。它是被禁建禁下來的，不是被珍惜留下來的。
    有意識的保存要到一九九八年——居民與文史工作者組了促進會，搶救舊街巷。珍惜是後來的事。
    一九九九到二〇〇三年完成居民徵收搬遷，成立歷史風貌特定區，開始修復再利用。二〇一〇年正式登錄為歷史建築。

    【在這裡討生活的人】
    一八八〇年代康定路與廣州街口是木炭、煤炭的交易集散地，大家叫它「土炭市」。
    一九二〇年代太陽製本所這類裝訂與印刷廠進駐，這裡是萬華印刷出版產業的發源地之一。
    一九四〇到七〇年代「茶桌仔店」興起，秀英茶室、長壽號這些地方是做工的人聚會的所在——談生意也談政治，消息在那裡傳開。
    一九五〇年代有「販仔間」——日祥旅社那一類，給來臺北打拼的苦力、搬運工與外地商販住的便宜地方。
