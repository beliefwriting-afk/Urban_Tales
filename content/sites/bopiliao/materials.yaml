# 剝皮寮歷史街區 —— 地方故事素材庫
#
# ★ facts 整段逐字進 system prompt（SDD §6.2）。措辭即成品。
# 來源：對話內容規劃_v0.1.md（2026-09-04，君和審過）。
#
# ⚠️ **容易寫錯的一條**：禁建不是「1941–1945 四年」，是**一路延續到二〇〇三年前後**。
#    「四年」與「六十年」是完全不同的故事——街廓能保到今天靠的是後者。

siteId: bopiliao

facts:
  zhHant: |
    剝皮寮是艋舺都市發展的活化石。清代這裡是艋舺通往古亭庄的縱貫商路，兩側是連棟
    店屋；地契上留下「福皮藔」「福地藔」等寫法，日治時期稱北皮寮街，戰後音轉才成了
    現在的名字。

    一九一〇到一九二二年間的市區改正開闢了廣州街與康定路，老街變成後巷（今康定路
    一七三巷），面向新街的店屋則蓋起亭仔腳與巴洛克式的牌樓立面。所以這裡是兩個時代
    並排的：一邊是清代的紅磚土角厝，一邊是日治的洋樓山牆。

    它留下來不是因為有人珍惜。一九四一年這一帶被劃入老松國小的擴建預定地，開始禁建，
    而這個禁令一直延續到二〇〇三年前後——六十年沒辦法改建，街廓就這樣被凍在原地。
    有意識的保存要等到一九九八年居民與文史工作者組成促進會之後。

    街上做過很多生意。康定路與廣州街口曾是木炭、煤炭的集散地，俗稱「土炭市」；
    一九二〇年代太陽製本所等裝訂印刷廠進駐；一九四〇到七〇年代有秀英茶室、長壽號
    這類「茶桌仔店」，是勞動階層交換消息的地方；一九五〇年代的「販仔間」旅社，
    提供來臺北打拼的苦力與外地商販廉價住宿。街區內還留著呂阿昌醫生宅與章太炎
    旅臺居所。

    修復分兩期，東側二〇〇六年完成，由臺北市教育局設立臺北市鄉土教育中心；西側
    二〇〇九年完工，由文化局負責藝文展演。二〇一〇年三月二十九日登錄為「剝皮寮
    歷史建築群」。同年二月電影《艋舺》上映，取景地就在這裡，之後人潮就沒斷過。
  en: null
  ja: null

