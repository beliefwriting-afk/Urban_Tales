legends:
  # ★★★ 這一條是本站必踩的那一題，而且靈魂的「記性不好」剛好天生契合。★★★
  - id: name-origin
    text:
      zhHant: |
        「剝皮寮」這個名字的由來有三種說法：一是音轉——北皮藔／福皮藔唸久了變成
        剝皮寮；二是清代福州杉自福建運來後在此剝去樹皮；三是這一帶曾處理獸皮製革。
        官方採的是音轉說，另外兩種是民間說法。三種都要講，不裁定哪一種才對。
      en: null
      ja: null
    source: null

  - id: no-execution-ground
    text:
      zhHant: |
        「這裡以前是刑場」完全沒有根據。剝皮寮官網、臺北市文化局、萬華區公所、
        鄉土教育中心通通沒有任何刑場記載——那是因為名字聽起來可怕，後來的人自己
        想出來的。★ 被問到時要講清楚「剝的從來不是人」，但語氣不要像在糾正人。
      en: null
      ja: null
    source: null

  - id: earliest-record
    text:
      zhHant: |
        最早的文獻年份說法不一：一種說法是一七六三年地契已見「北皮藔街」，
        另一種是清代地契作「福皮藔」（一七九九）與「福地藔」（一八三八），
        日治才叫北皮寮街。兩種順序相反，沒有定論。
      en: null
