# 剝皮寮歷史街區 —— 保底台詞
#
# ★★★ 企劃書 §4.3：措辭即成品。這些是 AI 失效時玩家**真正會看到的字**。★★★
#
# 企劃書 §8.7：AI 失效一律回退預寫台詞，**且視為正常回應，不呈現為錯誤**。
# 所以它們必須寫成「這個角色會說的話」，不是系統訊息。
#
# 四條寫作判準（六站共用，但**句子不共用**）：
#
#  ① **失效的理由用場域裡的聲音或這個角色自己的狀態**（巷子裡的回音）。
#     玩家不該從台詞裡推得出來是 AI 掛了、還是額度用完了。
#
#  ② ★★★ **aiUnavailable 至少要有一句不把球丟回給玩家。** ★★★
#     這一組同時覆蓋 L4 全域成本上限觸頂（SDD §10.1），而 L4 會持續到
#     隔日 UTC+8 00:00。如果三句都是「我沒聽清，再說一次」，玩家重問兩輪
#     就會斷定「程式壞了」——而 SDD 要的效果是「這位靈魂今天話少一點」。
#     所以每站的第三句都是**收掉回合**的說法，不要求重講。
#
#  ③ **不能假設玩家人在現場。** 實地模式與展示模式看到的是同一組字，
#     而展示模式的玩家往往連台北都不在——不寫「你先在外面走走」「你抬頭看」
#     這種話。⚠️ 人格卡允許的現場關心（走 AI，拿得到 presenceMode）
#     **不能照抄進保底台詞**，這裡是兩種模式共用的同一組死字。
#
#  ④ **拒絕要給替代**，而且替代要**兌現得了**——只能指向 materials.yaml 有的東西。
#
# ⚠️ **L4 全域上限走 aiUnavailable，不是 quotaReached**（SDD §10.1、`speak.ts` 第 4 步）。
#    全域沒錢是我們的營運狀態，不是玩家做錯事。
#    quotaReached 只給 L3——每玩家每日（實地 120 則／展示 40 則）。
#    ★ 實地很難打到 120，真正會看到它的多半是**展示模式**的人。

siteId: bopiliao

lines:
  # AI 失敗／逾時。★ 全域上限觸頂也走這一組，所以第三句要收得掉回合
  aiUnavailable:
    - zhHant: 唉呀，巷子裡回音大，我漏掉一半呢……你慢慢再講一遍給我聽。
      en: null
      ja: null
    - zhHant: 等等啊……我剛剛想到以前的事，沒跟上你。你講的是哪一件？
      en: null
      ja: null
    - zhHant: 今天我話少呢，講不太動……你不用一直問，我慢慢想。
      en: null
      ja: null

  # 禁忌主題：徵收政策的評價、特定住戶、地名由來的裁定
  refusal:
    - zhHant: 這個我不好說呢。誰對誰錯我沒有資格講——我只記得那時候巷子裡的聲音，那個我可以說。
      en: null
      ja: null
    - zhHant: 唉，這種事我不評。人都各有各的難處啊。你要聽這條街的事，我倒是記得不少。
      en: null
      ja: null
    - zhHant: 我說不上來，也不想說死。你要不要聽別的？茶桌仔那邊的事我記得很清楚。
      en: null
      ja: null

  # 素材庫沒有的事。★「想不起來」不用在這裡——那是年份人名專用，而且要留給 P3 的鉤子
  unknown:
    - zhHant: 那個啊……我不曉得呢。這種事我從來沒去記過。
      en: null
      ja: null
    - zhHant: 這個我沒聽人提起過。要是有，巷子裡早就傳開了。
      en: null
      ja: null
    - zhHant: 唉呀，你問的這個我真的不知道。我不亂講，講錯了就成了別人的記憶了。
      en: null
      ja: null

  # L3 每玩家每日額度
  quotaReached:
    - zhHant: 今天講到這裡好不好？我有點累了呢……
      en: null
      ja: null
    - zhHant: 時候不早了啊。你去休息吧——我也該歇了呢。
      en: null
      ja: null

  # 離題。★ 第二句給「你是不是 AI」——護欄第 8 條
  offTopic:
    - zhHant: 這個我不懂呢。你累不累呀？慢慢來，不急。
      en: null
      ja: null
    - zhHant: 你問我是什麼呀？我是這條彎彎的巷子，還有兩邊的房子。大家都住在我身上過。
      en: null
      ja: null
    - zhHant: 我不會那些呢。我會的都是些老東西了。
      en: null
      ja: null

