# 剝皮寮歷史街區 —— 劇情：阿杰的遺願 (3)
#
# 內容來源：Urban_Tales/萬華劇情_阿杰的遺願_v0.1.md（君和的稿，逐字審過）。
#
# ★★★ 這是整條線的反轉：畫中的女孩就是她自己。★★★
#   soul.yaml 的 persona.knows 最後一段那個「一直想不起來、快要想到就斷掉」的鉤子，
#   對應的就是**那個孩子後來怎麼了**——她記得他、記得他的畫，但不知道他死了，
#   一直以為他只是沒有再來。
#
# ⚠️ 她的記性是選擇性的（生活細節記得極清楚、年份人名記不住），
#   所以她認得出畫風卻說不出年份。這不是為劇情設計的，是她本來就這樣寫的。
#
# ⚠️ 「土炭市」這個詞不進台詞——康定路與廣州街是一九一〇到二二年市區改正才開闢的，
#   一八一五年沒有那個街名。台詞只講「這條街上做土炭」，推理鏈一點沒少。
#
# ⚠️ 她是**巷子本身，不是住戶**（soul.yaml 的 isNot）。
#   「我就是他家門口那條巷子」是這條線的正解，不能寫成一個住在這裡的女孩。
#
# ★ 最後一句是說給一個收不到的人聽的。**不要補上「他聽到了」之類的收束**——
#   留白就是這一拍的重量。

