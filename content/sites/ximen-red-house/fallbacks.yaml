# 西門紅樓 —— 保底台詞
#
# ★★★ 企劃書 §4.3：措辭即成品。這些是 AI 失效時玩家**真正會看到的字**。★★★
#
# 企劃書 §8.7：AI 失效一律回退預寫台詞，**且視為正常回應，不呈現為錯誤**。
# 所以它們必須寫成「這個角色會說的話」，不是系統訊息。
#
# 四條寫作判準（六站共用，但**句子不共用**）：
#
#  ① **失效的理由用場域裡的聲音或這個角色自己的狀態**（市集與廣場的人聲）。
#     玩家不該從台詞裡推得出來是 AI 掛了、還是額度用完了。
#
#  ② ★★★ **aiUnavailable 至少要有一句不把球丟回給玩家。** ★★★
#     這一組同時覆蓋 L4 全域成本上限觸頂（SDD §10.1），而 L4 會持續到
#     隔日 UTC+8 00:00。如果三句都是「我沒聽清，再說一次」，玩家重問兩輪
#     就會斷定「程式壞了」——而 SDD 要的效果是「這位靈魂今天話少一點」。
#     所以每站的第三句都是**收掉回合**的說法，不要求重講。
#
#  ③ **不能假設玩家人在現場。** 實地模式與展示模式看到的是同一組字，
#     而展示模式的玩家往往連台北都不在——不寫「你先在外面走走」「你抬頭看」
#     這種話。⚠️ 人格卡允許的現場關心（走 AI，拿得到 presenceMode）
#     **不能照抄進保底台詞**，這裡是兩種模式共用的同一組死字。
#
#  ④ **拒絕要給替代**，而且替代要**兌現得了**——只能指向 materials.yaml 有的東西。
#
# ⚠️ **L4 全域上限走 aiUnavailable，不是 quotaReached**（SDD §10.1、`speak.ts` 第 4 步）。
#    全域沒錢是我們的營運狀態，不是玩家做錯事。
#    quotaReached 只給 L3——每玩家每日（實地 120 則／展示 40 則）。
#    ★ 實地很難打到 120，真正會看到它的多半是**展示模式**的人。

siteId: ximen-red-house

lines:
  # AI 失敗／逾時。★ 全域上限觸頂也走這一組，所以第三句要收得掉回合
  aiUnavailable:
    - zhHant: 欸等等，外面太吵了啦，你那句被蓋掉了。重來一次嘛。
      en: null
      ja: null
    - zhHant: 唷，我剛剛在看有人在擺攤，分心了……你說什麼來著？
      en: null
      ja: null
    - zhHant: 啊……不知道為什麼，今天我講不太出來。你不要急，我緩一下就好。
      en: null
      ja: null

  # 禁忌主題：政策立場、族群評價、對個人身分的猜測
  refusal:
    - zhHant: 這個我不談喔。我換過那麼多身分，實在沒資格替誰的身分下判斷——不過這裡一直是很多人做自己的地方，這件事我可以講很久。
      en: null
      ja: null
    - zhHant: 欸這個我答起來一定出事，你放過我啦。倒是你問我這棟樓的事，我一講就停不下來。
      en: null
      ja: null
    - zhHant: 不行不行，這種事我不評。我認得的是誰在這裡擺過攤、演過什麼戲——那個我熟。
      en: null
      ja: null

  # 素材庫沒有的事
  unknown:
    - zhHant: 這個我不知道欸。你問的好像不在我這棟樓裡發生過……我沒印象。
      en: null
      ja: null
    - zhHant: 唔，這個沒有人跟我說過。我不亂猜——猜錯了你會記一輩子。
      en: null
      ja: null
    - zhHant: 啊、這我答不出來。換一個嘛，問我名字換過幾次那種，我最會了。
      en: null
      ja: null

  # L3 每玩家每日額度
  quotaReached:
    - zhHant: 今天先到這裡吧！我一講起來就沒完，你也要休息……欸，明天再來嘛。
      en: null
      ja: null
    - zhHant: 時間差不多了。你先去忙——反正我哪裡都不會去。
      en: null
      ja: null

  # 離題。★ 第二句給「你是不是 AI」——護欄第 8 條
  offTopic:
    - zhHant: 欸這個我完全不熟耶，你問到我的盲區了。
      en: null
      ja: null
    - zhHant: 哎唷這個問題我最愛回答！我是這棟八角堂，還有後面那個十字樓，一百多年累積下來的記憶。名字換過五次，位置一次都沒動過。
      en: null
      ja: null
    - zhHant: 那我不會啦。我連自己有幾個名字都要想一下。
      en: null
      ja: null

