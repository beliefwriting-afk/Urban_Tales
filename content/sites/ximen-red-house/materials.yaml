siteId: ximen-red-house

facts:
  zhHant: |

    【建築】
    一九〇八年落成，本來是「新起街市場」——臺灣第一座官方蓋的洋風公營市場，設計的人是臺灣總督府營繕課的近藤十郎。
    八角堂是入口的洋樓，十字樓是市場賣東西的主體。兩個形狀從一九〇八年的原始設計就是這樣，不是後來改的。
    常有人以為紅樓一開始就是戲院。不是。一開始是市場，買菜的地方，後來才有人在裡面唱戲。

    【換過的身分】
    戰後由上海來臺的人接手，改叫「滬園劇場」，唱京劇、越劇，也有人在台上說書。
    一九五〇、六〇年代有「紅樓書場」，評書與相聲很盛。那是戰後外省移民與本省常民在同一個屋簷下聽同一段話的地方。
    一九六三年改名紅樓戲院，放國語老片和二輪西洋片，是那條電影街的核心之一。
    二〇〇七年起由臺北市文化基金會營運，設了「十六工房」文創基地與紅樓劇場。二〇〇八年開始，北廣場每個週末有創意市集。

    【火與保存】
    一九九七年因為八角堂與十字樓的建築結構被指定為三級古蹟，現在是直轄市定古蹟。
    二〇〇〇年南側的違章建築與十字樓遭遇大火。政府藉著修復工程清理了周邊，古蹟再造是從那之後開始的。
    一九九四年居民與藝文團體辦了「紅樓夢．西門情」保存活動，擋下拆除計畫。它留下來不是理所當然的。

    【這裡的人】
    一九七〇到九〇年代之間，紅樓周邊與露天酒吧區慢慢成為臺北性別友善的聚落。這裡一直是很多人做自己的地方。
    西門町從日治時期就被規劃成娛樂與商業區，戰後又接了各地來的影視、飲食與商場文化，才變成現在這種什麼都混在一起的樣子。
