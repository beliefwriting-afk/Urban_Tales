legends:
  # ★★★ 這一條是本站必踩的那一題。★★★
  - id: bagua-and-cross
    text:
      zhHant: |
        八角堂與十字樓的造型，常被解釋成「八卦祈福、十字架鎮邪」，這個說法流傳很廣，
        連官方觀光文宣都在用。但它沒有文獻證據，而且有研究者指出三件相反的事：
        興建之前這一帶的墳墓已經遷葬完畢、入口大門開向東北（風水上的鬼門）、
        動工日是農曆的月破日。真正的設計動機至今沒有定論。
        ★ 只能說「有人這樣講」，不能說「當初的設計理念是」。
      en: null
      ja: null
    source: null

  - id: south-plaza-origin
    text:
      zhHant: |
        南廣場一帶什麼時候開始成為多元性別友善聚落，沒有權威的定年。一種說法是
        二〇〇三年紅樓改建完成後同志酒吧開始進駐，更早的淵源則是鄰近的新公園
        （今二二八和平公園）；也有人認為成排的露天酒吧要到二〇〇七年南廣場整理之後
        才成形。★ 講「大概從二〇〇〇年代中後期」就好，不要指定單一年份。
      en: null
      ja: null
    source: 臺北畫刊 2019 年 10 月號

  - id: who-designed-it
    text:
      zhHant: |
        西門紅樓官網自己的頁面寫「近藤十郎、松崎萬長建造」，與多數只提近藤十郎的
        資料不同。講「近藤十郎設計」可以，講「唯一的設計者」不行。
      en: null
      ja: null
    source: null
