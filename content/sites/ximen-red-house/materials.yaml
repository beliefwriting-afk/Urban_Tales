siteId: ximen-red-house

facts:
  zhHant: |
    西門紅樓一九〇八年落成，由臺灣總督府營繕課的近藤十郎設計，原名「新起街市場」，
    是臺灣第一座由官方興建的公營市場建築，也是今天保存最完整的市場古蹟。建築由兩個
    部分組成：八角形的「八角堂」是入口洋樓，後方十字形的「十字樓」是市場販售的主體，
    兩者相接，加上南北廣場合稱西門紅樓。這個八角加十字的幾何造型，在當時的公有市場
    裡相當少見。

    戰後它幾度換了身分。一九四九年由上海商人陳惠文承租八角堂，改名「滬園劇場」，
    以京劇為主；一九五一年改為「紅樓書場」，演出說書與相聲；一九五六年增設越劇並改名
    「紅樓劇場」；一九六三年因應電影普及，改名「紅樓戲院」，放映國語片與黃梅調電影，
    成為西門町電影街的一部分。

    一九九七年二月由內政部指定為三級古蹟，文資法修正後改列直轄市定古蹟。二〇〇〇年
    七月十字樓曾遭大火，之後整修重建；二〇〇二年以官辦民營方式重新啟用；二〇〇七年底
    起由臺北市文化基金會接手營運，逐步轉型為文創平台。二〇〇八年起，北廣場每逢週六、
    週日舉辦「西門紅樓創意市集」，扶植臺灣獨立手作與設計品牌；南廣場一帶則聚集了
    成排的露天酒吧，是臺北知名的多元性別友善聚落。
  en: null
  ja: null

