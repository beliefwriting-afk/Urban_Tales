siteId: ximen-red-house

items:
  # ── 建築 ──────────────────────────────────────────────
  - id: origin-1908
    kind: 已知史實
    topic: 建築
    text:
      zhHant: 一九〇八年落成，本來是「新起街市場」——臺灣第一座官方蓋的洋風公營市場，設計的人是臺灣總督府營繕課的近藤十郎。
      en: null
      ja: null
    source: 臺北市政府文化局／古蹟定案公告

  - id: octagon-cross
    kind: 已知史實
    topic: 建築
    text:
      zhHant: 八角堂是入口的洋樓，十字樓是市場賣東西的主體。兩個形狀從一九〇八年的原始設計就是這樣，不是後來改的。
      en: null
      ja: null
    source: 日本建築學會誌／建築師近藤十郎研究

  - id: geometry-meaning
    kind: 民間傳說
    topic: 建築
    text:
      zhHant: 有一種流傳的說法是「八卦祈福、十字架鎮邪」。那是對形狀的解釋，不是設計圖上寫的——而且這棟房子從來沒有當過廟。
      en: null
      ja: null
    source: null

  - id: not-a-theatre-first
    kind: 已知史實
    topic: 建築
    text:
      zhHant: 常有人以為紅樓一開始就是戲院。不是。一開始是市場，買菜的地方，後來才有人在裡面唱戲。
      en: null
      ja: null
    source: 臺北市政府文化局／古蹟定案公告

  # ── 換過的身分 ────────────────────────────────────────
  - id: shanghai-theatre-1945
    kind: 已知史實
    topic: 換過的身分
    text:
      zhHant: 戰後由上海來臺的人接手，改叫「滬園劇場」，唱京劇、越劇，也有人在台上說書。
      en: null
      ja: null
    source: 臺北市志／展演歷史檔案

  - id: book-stage-1950s
    kind: 已知史實
    topic: 換過的身分
    text:
      zhHant: 一九五〇、六〇年代有「紅樓書場」，評書與相聲很盛。那是戰後外省移民與本省常民在同一個屋簷下聽同一段話的地方。
      en: null
      ja: null
    source: 西門町文史采風紀錄

  - id: cinema-1963
    kind: 已知史實
    topic: 換過的身分
    text:
      zhHant: 一九六三年改名紅樓戲院，放國語老片和二輪西洋片，是那條電影街的核心之一。
      en: null
      ja: null
    source: 臺灣電影資料庫

  - id: creative-2007
    kind: 已知史實
    topic: 換過的身分
    text:
      zhHant: 二〇〇七年起由臺北市文化基金會營運，設了「十六工房」文創基地與紅樓劇場。二〇〇八年開始，北廣場每個週末有創意市集。
      en: null
      ja: null
    source: 西門紅樓官方歷史紀錄／臺北市文化基金會史料

  # ── 火與保存 ──────────────────────────────────────────
  - id: heritage-1997
    kind: 已知史實
    topic: 火與保存
    text:
      zhHant: 一九九七年因為八角堂與十字樓的建築結構被指定為三級古蹟，現在是直轄市定古蹟。
      en: null
      ja: null
    source: 文化部文化資產局

  - id: fire-2000
    kind: 已知史實
    topic: 火與保存
    text:
      zhHant: 二〇〇〇年南側的違章建築與十字樓遭遇大火。政府藉著修復工程清理了周邊，古蹟再造是從那之後開始的。
      en: null
      ja: null
    source: 臺北市文化基金會／新聞報導

  - id: save-1994
    kind: 已知史實
    topic: 火與保存
    text:
      zhHant: 一九九四年居民與藝文團體辦了「紅樓夢．西門情」保存活動，擋下拆除計畫。它留下來不是理所當然的。
      en: null
      ja: null
    source: 紙風車文教基金會歷史檔案

  # ── 這裡的人 ──────────────────────────────────────────
  - id: subculture-1970s
    kind: 已知史實
    topic: 這裡的人
    text:
      zhHant: 一九七〇到九〇年代之間，紅樓周邊與露天酒吧區慢慢成為臺北性別友善的聚落。這裡一直是很多人做自己的地方。
      en: null
      ja: null
    source: 臺灣性別運動史料／當代社會學研究

  - id: ximending-tone
    kind: 已知史實
    topic: 這裡的人
    text:
      zhHant: 西門町從日治時期就被規劃成娛樂與商業區，戰後又接了各地來的影視、飲食與商場文化，才變成現在這種什麼都混在一起的樣子。
      en: null
      ja: null
    source: 臺北市志／西門紅樓官方歷史紀錄
