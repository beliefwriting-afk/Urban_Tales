# 西門紅樓 —— 劇情：阿杰的遺願 (1)
#
# 內容來源：Urban_Tales/萬華劇情_阿杰的遺願_v0.1.md（君和的稿，逐字審過）。
#
# ⚠️ 紅樓一九〇八年才落成，**1815 年的事她一個字都沒親眼看過**。
#   這一段全部是龍山寺轉述給她的，台詞不能寫成她在場過。
# ⚠️ 她對創作認真（soul.yaml 的 persona.knows 最後一段），
#   所以她看畫看的是筆觸與線條——那是她會注意、別人不會注意的地方。

siteId: ximen-red-house

quest:
  title:
    zhHant: 阿杰的遺願 (1)
    en: null
    ja: null
  summary:
    zhHant: 把信拿給紅樓看看。她收東西收了一百年，也許知道些什麼。
    en: null
    ja: null

entry:
  text:
    zhHant: 我這裡有封信，您可以幫幫我嗎？
    en: null
    ja: null

response:
  card:
    title:
      zhHant: 紅樓說起一張畫
      en: null
      ja: null
    quote:
      zhHant: 不是我遇到的，是龍山那個老的跟我講的。
      en: null
      ja: null
  body:
    - zhHant: 欸，你等一下——這個字跡……
      en: null
      ja: null
    - zhHant: ……我看看。嘉慶二年。那比我早太多了，我那時候還不在，這裡連街都還沒有我。
      en: null
      ja: null
    - zhHant: 唷，這孩子會畫畫喔。
      en: null
      ja: null
    - zhHant: |
        對了對了，我想起來了，這件事我知道！不是我遇到的，是龍山那個老的跟我講的。
        他說很久以前有個男孩來找他，看起來十七八歲，手上拿著一張畫，
        問他有沒有看過畫裡的人。老的說他那時候……嗯，他那時候自己也很不好，
        什麼都記不住。男孩站了很久，最後把畫留下來就走了。
      en: null
      ja: null
    - zhHant: |
        那張畫後來到我這裡來了。老的說一張畫放在廟裡也不是辦法，
        我這邊剛好一直有人在擺攤、在做東西——他就交給我了。
      en: null
      ja: null
    - zhHant: ……啊、我又講太多了。
      en: null
      ja: null
    - zhHant: 喏，就是這張。你自己看。
      en: null
      ja: null
    - zhHant: |
        我跟你講，這個線條是炭畫的，不是墨。炭很難控制，一按下去就糊，
        他能畫成這樣，是天天在摸炭的手。畫得醜歸醜，可是他很認真——
        他把她的髮際線描了三次，你看，這裡有三層。
      en: null
      ja: null
    - zhHant: |
        欸，你要不要去問問龍山那個老的？他人在，記性也回來了。
        我這裡是收著這張畫，可是故事不是我的。
      en: null
      ja: null

# 任務 (1) 的道具：首次進入本站 L2 時取得。
item:
  id: ajie-letter
  name:
    zhHant: 阿杰的信
    en: null
    ja: null
  body:
    - zhHant: 我生在嘉慶二年。
      en: null
      ja: null
    - zhHant: |
        我家在剝皮寮，做土炭的生意。爹娘成親得晚，就我一個孩子，
        所以我很小就跟著顧生意，想讓他們輕鬆一點。
      en: null
      ja: null
    - zhHant: |
        我的日子很簡單，大半時間都在顧火、篩炭。手上永遠是黑的，怎麼洗都洗不乾淨。
        偶爾我會拿一塊炭在地上畫畫。我畫得不好，可是很好玩。
      en: null
      ja: null
    - zhHant: |
        我家附近有個女孩。我們住得很近，她常常跑來看我做事。
        閒下來的時候我就跟她說話，有時候當場畫給她看。她很溫柔。
        跟她在一起的時候，我很快樂。
      en: null
      ja: null
    - zhHant: |
        有一天我出門替爹娘買東西，路上出了事。事情發生得很快，
        我還沒弄清楚就被壓住了。我勉強睜開眼睛，看出去全是塌下來的東西。
        後來我越來越沒有力氣……
      en: null
      ja: null
    - zhHant: 我想我爹娘，也想那個女孩。可是我走了很久很久，一直找不到回家的路。
      en: null
      ja: null
    - zhHant: |
        有一次我走著走著，走到了龍山寺。我家離那裡很近，鄰居常常來拜拜，
        求家裡平安、生意順利。我想到爹娘跟她，就走了進去，求他們都好好的。
        他們一定很想我，可是我大概回不去了。
      en: null
      ja: null
    - zhHant: |
        那裡有一位伯伯。他在那裡待了很久，看過那麼多人，也許他幫得上忙。
        我找了張紙，把女孩畫下來，問他有沒有看過她。
      en: null
      ja: null
    - zhHant: 他說他不記得了。
      en: null
      ja: null
    - zhHant: 快一百天了。我大概是真的見不到他們了。
      en: null
      ja: null
    - zhHant: 如果可以的話——有沒有人願意替我去看看他們，看他們過得好不好。
      en: null
      ja: null
  art: null

# ⚠️ 她只知道到「畫交出去了」為止。反轉是剝皮寮那一站的事，
#   她自己也不知道——所以這一段不能有任何往那邊的暗示。
afterStory:
  zhHant: |
    後來有人拿了一封信來找我，是一個嘉慶年間的孩子寫的。我把收了一百年的那張畫
    交出去了。那孩子在找一個女孩，找不到路回家。後面怎麼樣我就不知道了——
    那是龍山跟剝皮寮那邊的事，我只是幫忙收著畫的人。
  en: null
  ja: null
