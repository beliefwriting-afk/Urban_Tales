legends:
  # ★★★ 這一條是本站必踩的那一題。★★★
  - id: the-water-cell
    text:
      zhHant: |
        大家都叫它「水牢」，但它的用途沒有定論，而且官方自己也這樣說。臺北市文化局
        的說法是刑求方式「至今仍是一團迷霧」；與館方合作的導覽資料寫天花板那個孔
        「依推估」可能是注水用，並直言「皆未有相關史料記載」。刑求說是文資委員
        李乾朗等人的推論，不是史料。舊大同分局的員警還說過那個空間從未放水，
        但偶爾查看竟發現裡面有水，沒人知道原因。

        ★ 可以講「大家都叫它水牢」，**不能**講「這裡曾經如何刑求」。
        ★ 也**不要**替它提出「其實是消防蓄水池／澡堂」這類替代說法——
          那些同樣沒有來源。官方立場是「不明」，不是「另有他說」。
      en: null
      ja: null
    source: null

