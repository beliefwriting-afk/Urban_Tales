# 臺灣新文化運動紀念館 —— 地方故事素材庫
#
# ★ facts 整段逐字進 system prompt（SDD §6.2）。措辭即成品。
# 來源：對話內容規劃_v0.1.md（2026-09-04，君和審過）。
#
# ★★★ 本站最重要的一句話在 facts 最後一段：**蔣渭水沒有被關在現存這棟建築裡。**
#      那是館方官網自己講的，可以斬釘截鐵，而且是這個角色最值得講的一句。
#
# ⚠️ 「水牢」的用途**沒有任何史料**。它在 legends，不在 facts。

siteId: new-culture-movement

facts:
  zhHant: |
    這棟樓一九三二年八月八日破土，一九三三年四月十五日竣工，是臺北北警察署的廳舍，
    由臺灣總督府官房營繕課設計，施工有臺籍人士參與。兩層樓的水泥建築設在兩條街的
    交會口，外觀呈流線形，入口就開在轉角，門邊有一對變體的西洋式柱子。外牆的褐色
    面磚由北投窯廠燒製，這個顏色又叫「國防色」，是為了防空。

    建築裡面保存了兩處遺構。一是扇形拘留室——站在中心點就能同時監看多間牢房，
    是全國唯一的扇形拘留所。二是一個高度僅約一百二十公分的小空間，注滿水時成人
    在裡面既無法站直、也無法坐臥，天花板上有一個小孔。

    戰後這裡先後由臺北市警察局、刑警總隊與大同分局使用，作為警政據點又是半個世紀。
    一九九八年三月二十五日指定為市定古蹟，二〇一四年大同分局遷出後啟動古蹟考證與
    修復，二〇一八年十月十四日開館，同日推出常設展。

    這棟樓紀念的事情比它自己老。一九二一年十月十七日，臺灣文化協會在附近的靜修
    高等女學校禮堂成立，蔣渭水是主要發起人，並邀請林獻堂出任總理，出席會員三百
    餘人。一九二三年十二月十六日治警事件，蔣渭水等人被捕。他寫過《北署遊記》
    《再遊北署》《三遊北署》三篇，用戲謔的筆法記下獄中的事。

    常被講錯的一件事：蔣渭水沒有被關在現存這棟建築裡。他被監禁的是舊址，也就是
    今天家樂福重慶店的位置，那是木造的第一代北警察署，早就拆了。他一九三一年
    八月五日逝世，這棟樓一九三二年才動工，時間上不可能。
  en: null
  ja: null

