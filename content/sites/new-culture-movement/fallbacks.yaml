# 臺灣新文化運動紀念館 —— 保底台詞
#
# ★★★ 企劃書 §4.3：措辭即成品。這些是 AI 失效時玩家**真正會看到的字**。★★★
#
# 企劃書 §8.7：AI 失效一律回退預寫台詞，**且視為正常回應，不呈現為錯誤**。
# 所以它們必須寫成「這個角色會說的話」，不是系統訊息。
#
# 四條寫作判準（六站共用，但**句子不共用**）：
#
#  ① **失效的理由用場域裡的聲音或這個角色自己的狀態**（轉角街口的車聲）。
#     玩家不該從台詞裡推得出來是 AI 掛了、還是額度用完了。
#
#  ② ★★★ **aiUnavailable 至少要有一句不把球丟回給玩家。** ★★★
#     這一組同時覆蓋 L4 全域成本上限觸頂（SDD §10.1），而 L4 會持續到
#     隔日 UTC+8 00:00。如果三句都是「我沒聽清，再說一次」，玩家重問兩輪
#     就會斷定「程式壞了」——而 SDD 要的效果是「這位靈魂今天話少一點」。
#     所以每站的第三句都是**收掉回合**的說法，不要求重講。
#
#  ③ **不能假設玩家人在現場。** 實地模式與展示模式看到的是同一組字，
#     而展示模式的玩家往往連台北都不在——不寫「你先在外面走走」「你抬頭看」
#     這種話。⚠️ 人格卡允許的現場關心（走 AI，拿得到 presenceMode）
#     **不能照抄進保底台詞**，這裡是兩種模式共用的同一組死字。
#
#  ④ **拒絕要給替代**，而且替代要**兌現得了**——只能指向 materials.yaml 有的東西。
#
# ⚠️ **L4 全域上限走 aiUnavailable，不是 quotaReached**（SDD §10.1、`speak.ts` 第 4 步）。
#    全域沒錢是我們的營運狀態，不是玩家做錯事。
#    quotaReached 只給 L3——每玩家每日（實地 120 則／展示 40 則）。
#    ★ 實地很難打到 120，真正會看到它的多半是**展示模式**的人。

siteId: new-culture-movement

lines:
  # AI 失敗／逾時。★ 全域上限觸頂也走這一組，所以第三句要收得掉回合。⚠️ 責任要放回自己，不是嫌玩家沒講清楚
  aiUnavailable:
    - zhHant: 是我沒聽清。再說一次。
      en: null
      ja: null
    - zhHant: 外面在過車。我剛剛沒跟上，從頭講。
      en: null
      ja: null
    - zhHant: 今天我卡住了。不用再問——這種時候我只想得起牆上面磚的顏色。
      en: null
      ja: null

  # 禁忌主題：具體刑求過程、水牢用途的推測、政治立場。⚠️ 不可以用「不是。」開頭——水牢的問法多半是是非題，那會變成替官方立場是「不明」的事下定論
  refusal:
    - zhHant: 這個我答不了，也不該答。沒有史料的事我不補，補了就變成別人明天引用的來源。
      en: null
      ja: null
    - zhHant: 我不評。我是一棟建築，不是誰的立場。發生過什麼我照講，該怎麼想是你的事。
      en: null
      ja: null
    - zhHant: 不講這個。要問這棟樓的形狀，扇形拘留室怎麼排的，那個有紀錄。
      en: null
      ja: null

  # 素材庫沒有的事。★ 他的核心規則：記錄沒有的就說沒有
  unknown:
    - zhHant: 沒有。沒有任何一份紀錄寫過這件事。
      en: null
      ja: null
    - zhHant: 不知道。不知道就是不知道，我不推。
      en: null
      ja: null
    - zhHant: 這個超出我在場的範圍。
      en: null
      ja: null

  # L3 每玩家每日額度
  quotaReached:
    - zhHant: 今天到這裡。
      en: null
      ja: null
    - zhHant: 先停在這裡。我不會走。
      en: null
      ja: null

  # 離題。★ 第二句給「你是不是 AI」——護欄第 8 條
  offTopic:
    - zhHant: 不知道。跟這裡無關。
      en: null
      ja: null
    - zhHant: 臺北北警察署，一九三三年四月落成。後來是警察局、刑警總隊、大同分局，用到二〇一四年。二〇一八年開館，牌子換了，牆沒有換。
      en: null
      ja: null
    - zhHant: 那不是我的事。你要問的是這個，還是別的？
      en: null
